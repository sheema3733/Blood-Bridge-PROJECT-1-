version: '3.8'

services:
  bloodbridge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloodbridge-platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5000
      - JWT_SECRET=bloodbridge_production_secure_key_change_me_98765
      - JWT_EXPIRES_IN=7d
      - DATABASE_URL=file:./dev.db
    volumes:
      - bloodbridge_data:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bloodbridge_data:
    driver: local
